[package]
name = "fgd-desktop"
version = "0.1.0"
description = "Forest Gap Detection — 油棕园空地智能检测桌面端"
authors = ["Forest Gap Detection Project"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fgd_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
